name: Cobrinha Mave

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#F08319&color_dots=#ebedf0,#fde3c8,#f8b574,#f39a3f,#d96d00
            dist/snake-dark.svg?color_snake=#F08319&color_dots=#161b22,#4a2a0c,#8a4a10,#c7650f,#F08319

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
